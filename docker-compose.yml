# -------------------------------------------------
#  CHAR9000 - personal AI friend & agent platform
#  Target: Windows 11 + Docker Desktop (WSL2 backend), NVIDIA RTX 4090 (24 GB), 128 GB RAM
#  Ollama and ComfyUI run natively on Windows; containers reach them via host.docker.internal.
#  All ports bind to 127.0.0.1 - only this PC can reach CHAR9000.
#  Settings and secrets: .env (generated by scripts\install.ps1, never committed).
# -------------------------------------------------

x-n8n: &service-n8n
  image: n8nio/n8n:2.43.8@sha256:a18edcf018198b33b5488fb47ededafe11e0b10d28f65b9535b7c447c9ce3b2c
  networks: ['char9000']
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &n8n-env
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: postgres
    DB_POSTGRESDB_USER: ${POSTGRES_USER}
    DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
    N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
    N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_USER_MANAGEMENT_JWT_SECRET}
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    N8N_RUNNERS_ENABLED: "true"
    EXECUTIONS_MODE: queue
    QUEUE_BULL_REDIS_HOST: redis
    QUEUE_BULL_REDIS_PORT: "6379"
    QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
    N8N_RESTRICT_FILE_ACCESS_TO: /data/shared;/files
    GENERIC_TIMEZONE: ${TZ:-America/New_York}
  volumes:
    - ./data/shared:/data/shared
    - ./data/files:/files:ro
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

volumes:
  char9000_n8n_storage:
  char9000_postgres:
  char9000_qdrant:
  char9000_openwebui:

networks:
  char9000:
    driver: bridge

# Memory budget (128 GB PC): WSL2 capped at 40 GB by install.ps1 (.wslconfig); containers ~22 GB.
# The rest stays with Windows, Ollama and ComfyUI (model offload, games, apps).
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    container_name: char9000-postgres
    networks: ['char9000']
    restart: unless-stopped
    command: >
      postgres -c shared_buffers=2GB -c effective_cache_size=6GB -c work_mem=32MB
               -c maintenance_work_mem=512MB -c random_page_cost=1.1
    shm_size: 512m
    mem_limit: 4g
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - char9000_postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: char9000-redis
    networks: ['char9000']
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "512mb"]
    mem_limit: 768m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n:
    <<: *service-n8n
    container_name: char9000-n8n
    restart: unless-stopped
    mem_limit: 3g
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      <<: *n8n-env
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"           # localhost only, no HTTPS
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
    volumes:
      - char9000_n8n_storage:/home/node/.n8n
      - ./data/shared:/data/shared
      - ./data/files:/files:ro

  # 2 workers x concurrency 2: one GPU is the real limit
  n8n-worker:
    <<: *service-n8n
    restart: unless-stopped
    command: ["worker", "--concurrency=2"]
    mem_limit: 2g
    environment:
      <<: *n8n-env
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
    deploy:
      replicas: 2

  qdrant:
    image: qdrant/qdrant:v1.19.2@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    container_name: char9000-qdrant
    networks: ['char9000']
    restart: unless-stopped
    mem_limit: 4g
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - char9000_qdrant:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}

  crewai:
    build: ./crewai
    container_name: char9000-crewai
    networks: ['char9000']
    restart: unless-stopped
    mem_limit: 3g
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_API_BASE: http://host.docker.internal:11434
      N8N_WEBHOOK_BASE: http://n8n:5678/webhook
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      POSTGRES_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CHAR9000_MODEL_MAIN: ${CHAR9000_MODEL_MAIN:-qwen3.6:27b}
      CHAR9000_MODEL_CODER: ${CHAR9000_MODEL_CODER:-qwen2.5-coder:14b}
      CHAR9000_MODEL_LIGHT: ${CHAR9000_MODEL_LIGHT:-gemma3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - qdrant

  pydantic-ai:
    build: ./pydantic-ai
    container_name: char9000-pydantic-ai
    networks: ['char9000']
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      CHAR9000_MODEL_MAIN: ${CHAR9000_MODEL_MAIN:-qwen3.6:27b}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.3
    container_name: char9000-open-webui
    networks: ['char9000']
    restart: unless-stopped
    mem_limit: 4g
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      WEBUI_NAME: CHAR9000
      DEFAULT_MODELS: CHAR9000:latest
      RAG_EMBEDDING_ENGINE: ollama
      RAG_EMBEDDING_MODEL: nomic-embed-text
      ENABLE_SIGNUP: "true"                # first account = admin; install.ps1 tells her to turn signup off after
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - char9000_openwebui:/app/backend/data

  # On-demand: docker compose run --rm ingest --source /data/files --collection my_documents
  ingest:
    build: ./ingest
    container_name: char9000-ingest
    profiles: ['ingest']
    networks: ['char9000']
    mem_limit: 4g
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
    volumes:
      - ./data/files:/data/files:ro
